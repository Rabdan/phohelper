version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: phomenu_db
    environment:
      POSTGRES_DB: phomenu
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  bot:
    build: ./bot
    container_name: phomenu_bot
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: phomenu_admin
    ports:
      - "3002:3000"
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
